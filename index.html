<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#f7f3ff"><title>宠物健康小助手</title><style>:root{--ink:#24213d;--muted:#918da3;--line:#eeeaf7;--bg:#fbf9ff;--card:#fff;--purple:#8c6cf1;--purple2:#b7a2ff;--pink:#ff7fa1;--mint:#6fd6c6;--green:#48bc7c;--orange:#ffb24d;--red:#ff6978;--shadow:0 16px 42px rgba(101,86,149,.13)}*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 20% 0,#efe8ff 0 220px,transparent 380px),linear-gradient(180deg,#fff,#fbf9ff);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"PingFang SC",system-ui,sans-serif}.phone{max-width:430px;min-height:100vh;margin:auto;padding:max(14px,env(safe-area-inset-top)) 16px calc(90px + env(safe-area-inset-bottom));position:relative}.page{display:none}.page.on{display:block}.top{display:flex;align-items:center;justify-content:space-between;margin:8px 0 18px}.pet{display:flex;align-items:center;gap:12px}.avatar{width:62px;height:62px;border-radius:24px;background:linear-gradient(145deg,#fff3df,#ffe8f0);display:grid;place-items:center;font-size:38px;box-shadow:var(--shadow)}h1,h2,h3,p{margin:0}h1{font-size:24px;letter-spacing:0;font-weight:900}.sub{color:var(--muted);font-size:13px;margin-top:4px}.iconbtn{width:42px;height:42px;border:0;border-radius:16px;background:#fff;box-shadow:var(--shadow);color:var(--purple);font-size:20px}.card{background:rgba(255,255,255,.88);border:1px solid rgba(238,234,247,.9);border-radius:20px;box-shadow:var(--shadow);padding:18px;margin:14px 0}.soft{background:linear-gradient(145deg,#fff,#f5f0ff)}.label{font-size:15px;font-weight:900;color:#6352c9}.big{font-size:42px;line-height:1;font-weight:950;color:#151326}.ok{display:inline-flex;align-items:center;gap:4px;color:#3faf74;font-weight:800;font-size:13px}.bars{height:92px;display:flex;align-items:end;gap:9px}.bar{width:18px;border-radius:10px 10px 4px 4px;background:linear-gradient(180deg,#d9ccff,#8c6cf1);opacity:.45;position:relative}.bar b{position:absolute;bottom:-22px;left:50%;transform:translateX(-50%);font-size:10px;color:#bab5c9}.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}.pee-card{display:grid;grid-template-columns:1fr 124px;gap:10px}.medrow,.recrow,.statrow{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:12px 0;border-top:1px solid var(--line)}.medrow:first-child,.recrow:first-child{border-top:0}.time{font-weight:900;font-size:17px}.medname{font-weight:900}.dose{font-size:13px;color:#a77b32;font-weight:800}.pill{border:0;border-radius:999px;padding:10px 18px;background:#f4f1fb;color:#89839e;font-weight:900}.pill.on{background:linear-gradient(90deg,var(--pink),#ff9db5);color:white}.primary{width:100%;height:56px;border:0;border-radius:22px;background:linear-gradient(90deg,var(--purple2),var(--purple));color:white;font-weight:950;font-size:17px;box-shadow:0 12px 28px rgba(140,108,241,.3)}.pink{background:linear-gradient(90deg,#ff91ad,#ff6f98)}.ghost{border:0;background:#f5f2fb;color:var(--purple);border-radius:18px;height:46px;padding:0 16px;font-weight:900}.tiny{font-size:12px;color:var(--muted)}.tabs{position:fixed;z-index:9;left:50%;bottom:0;transform:translateX(-50%);width:min(430px,100%);height:76px;padding:8px 14px max(8px,env(safe-area-inset-bottom));background:rgba(255,255,255,.92);border-top:1px solid var(--line);display:grid;grid-template-columns:repeat(4,1fr);backdrop-filter:blur(14px)}.tab{border:0;background:transparent;color:#a6a1b2;font-size:11px;font-weight:900}.tab span{display:block;font-size:22px;margin-bottom:2px}.tab.on{color:var(--purple)}.head{display:flex;align-items:center;justify-content:space-between;margin:8px 0 16px}.back{border:0;background:transparent;font-size:28px;color:#38324e}.dates{display:flex;gap:10px;overflow:auto;padding:2px 0 12px}.datepill{min-width:70px;border:0;border-radius:16px;background:transparent;color:#9a94a8;padding:9px 10px;font-weight:900}.datepill.on{background:var(--purple);color:white}.water{width:34px;height:34px;border-radius:12px;background:#dff8f4;display:grid;place-items:center;font-size:20px}.status{color:var(--green);font-weight:900}.chev{color:#bdb7ca}.summary{display:grid;grid-template-columns:1fr 1fr;text-align:center;background:linear-gradient(145deg,#fff,#f2eeff);border-radius:22px;padding:18px}.summary div+div{border-left:1px solid #e2dbf4}.seg{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;background:#fff;border-radius:18px;padding:6px;margin-bottom:16px}.seg button{border:0;border-radius:14px;background:transparent;height:42px;color:#918aa1;font-weight:900}.seg button.on{background:#ff7fa1;color:white}.plan{position:relative;margin-left:28px}.plan:before{content:"";position:absolute;left:0;top:20px;bottom:20px;border-left:1px solid #e5dfef}.planrow{display:grid;grid-template-columns:70px 1fr;gap:14px;align-items:center;margin:18px 0}.dot{width:18px;height:18px;border-radius:50%;background:#d8d4e2;border:4px solid #fff;box-shadow:0 0 0 1px #d8d4e2;position:absolute;left:-8px}.plantime{font-weight:900;color:#59b986}.plantime.late{color:#ff6576}.plancard{background:#fff;border-radius:18px;box-shadow:var(--shadow);padding:14px;display:flex;align-items:center;justify-content:space-between}.addplus{width:36px;height:36px;border-radius:50%;border:0;background:var(--purple);color:white;font-size:24px}.catbox{text-align:center;padding:12px 0 0}.catbig{font-size:86px;line-height:1}.bubble{display:inline-block;border:2px solid #a5e6d5;border-radius:20px;padding:12px 16px;color:#51ad8b;font-weight:900;background:#fafffd}.chart{height:170px;position:relative;margin-top:12px}.chart svg{width:100%;height:100%;overflow:visible}.metric{background:linear-gradient(145deg,#fff,#f0faf8);border-radius:18px;padding:16px;text-align:center}.metric b{font-size:28px}.ring{width:78px;height:78px;border-radius:50%;background:conic-gradient(var(--purple) 0 345deg,#eee9fb 0);display:grid;place-items:center;margin:auto;font-weight:950;font-size:21px}.modal{position:fixed;inset:0;z-index:20;background:rgba(25,20,45,.36);display:none;align-items:end;justify-content:center}.modal.on{display:flex}.sheet{width:min(430px,100%);max-height:88vh;overflow:auto;background:#fff;border-radius:28px 28px 0 0;padding:18px 18px max(22px,env(safe-area-inset-bottom));box-shadow:0 -20px 60px rgba(47,38,72,.25)}.sheethead{display:flex;align-items:center;justify-content:space-between;margin-bottom:16px}.x{border:0;background:transparent;font-size:24px}.field{margin:14px 0}.field label{font-size:14px;color:#3b3455}.chips{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.chip{border:0;border-radius:16px;background:#f6f3fb;min-height:64px;color:#918aa1;font-weight:900}.chip.on{background:#f0eaff;color:var(--purple);box-shadow:inset 0 0 0 2px #d8ccff}.colors{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}.colorchip{border:0;background:white;text-align:center;color:#8e879d;font-weight:800}.colorchip i{display:block;width:30px;height:30px;border-radius:50%;margin:0 auto 6px}.colorchip.on i{box-shadow:0 0 0 4px #e9fff6,0 0 0 7px var(--mint)}input,textarea,select{width:100%;border:0;background:#f8f6fb;border-radius:16px;padding:14px 15px;font:inherit;color:var(--ink)}textarea{min-height:86px;resize:vertical}.formgrid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.empty{text-align:center;color:#aaa4b6;padding:22px}.toast{position:fixed;left:50%;bottom:92px;transform:translateX(-50%);background:#211b35;color:white;border-radius:999px;padding:12px 18px;font-weight:900;opacity:0;pointer-events:none;transition:.2s}.toast.on{opacity:1}@media(min-width:760px){.phone{box-shadow:0 0 0 1px #eee,0 30px 80px rgba(65,51,103,.16);border-radius:34px;margin-top:20px;min-height:860px}.tabs{border-radius:0 0 34px 34px}}</style></head><body><main class="phone"><section id="home" class="page on"><div class="top"><div class="pet"><div class="avatar">🐱</div><div><h1 id="homeName">咪咪</h1><p class="sub"><span id="petInfo">体重 5.2kg</span></p></div></div><button class="iconbtn" id="editPet">♡</button></div><div class="card soft pee-card"><div><p class="label">今日尿尿</p><p><span class="big" id="todayCount">0</span> 次</p><p class="ok" id="rangeText">正常范围 ✓</p></div><div class="bars" id="miniBars"></div></div><div class="card"><div class="head"><h2>今日用药</h2><p class="tiny" id="medProgress">0/0 已完成</p></div><div id="homeMeds"></div></div><button class="primary" id="quickPee">💧 记录尿尿</button></section><section id="peePage" class="page"><div class="head"><button class="back" data-go="home">‹</button><h2>尿尿记录</h2><button class="iconbtn" id="openPee2">＋</button></div><div class="dates" id="dates"></div><div class="card"><div id="peeList"></div></div><div class="summary"><div><p class="tiny">今日共</p><b id="sumCount">0 次</b></div><div><p class="tiny">平均间隔</p><b id="avgGap">--</b></div></div><button class="primary" id="openPee3">＋ 添加记录</button></section><section id="medPage" class="page"><div class="head"><button class="back" data-go="home">‹</button><h2>用药计划</h2><button class="addplus" id="openMed">+</button></div><div class="seg"><button class="on" data-filter="all">今日</button><button data-filter="active">全部</button><button data-filter="stopped">已停用</button></div><p class="sub" id="medDate"></p><div class="plan" id="plan"></div><div class="catbox"><span class="bubble">按时吃药<br>身体棒棒！</span><div class="catbig">🐈‍⬛</div></div></section><section id="statsPage" class="page"><div class="head"><button class="back" data-go="home">‹</button><h2>数据统计</h2><button class="iconbtn" id="exportData">⇩</button></div><div class="seg"><button class="on">尿尿</button><button>用药</button><button id="exportIcs">提醒</button></div><div class="card"><h3>过去7天尿尿次数</h3><div class="chart"><svg viewBox="0 0 320 150"><g id="chartGrid"></g><polyline id="chartLine" fill="none" stroke="#8c6cf1" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/><g id="chartDots"></g></svg></div></div><div class="grid2"><div class="metric"><p class="tiny">平均次数/天</p><b id="avgDay">0</b></div><div class="metric"><p class="tiny">平均间隔</p><b id="avgAllGap">--</b></div></div><div class="card grid2"><div><div class="ring" id="rateRing">0%</div><p class="tiny" style="text-align:center;margin-top:8px">本周用药完成率</p></div><div class="metric"><p class="tiny">漏服次数</p><b id="missed">0</b></div></div></section><nav class="tabs"><button class="tab on" data-go="home"><span>⌂</span>首页</button><button class="tab" data-go="peePage"><span>💧</span>尿尿</button><button class="tab" data-go="medPage"><span>💊</span>用药</button><button class="tab" data-go="statsPage"><span>▥</span>数据</button></nav></main><div class="modal" id="peeModal"><div class="sheet"><div class="sheethead"><button class="x" data-close="peeModal">×</button><h2>添加尿尿记录</h2><button class="x" id="savePee">✓</button></div><div class="field"><label>时间</label><input id="peeTime" type="datetime-local"></div><div class="field"><label>尿量</label><div class="chips" id="amountChips"><button class="chip" data-v="少">💧<br>少</button><button class="chip on" data-v="正常">💧<br>正常</button><button class="chip" data-v="多">💧<br>多</button></div></div><div class="field"><label>颜色</label><div class="colors" id="colorChips"><button class="colorchip on" data-v="浅黄"><i style="background:#ffd86b"></i>浅黄</button><button class="colorchip" data-v="深黄"><i style="background:#f6a640"></i>深黄</button><button class="colorchip" data-v="橙色"><i style="background:#ff9448"></i>橙色</button><button class="colorchip" data-v="红色"><i style="background:#ff656d"></i>红色</button></div></div><div class="field"><label>备注</label><textarea id="peeNote" placeholder="可选，记录异常情况... "></textarea></div></div></div><div class="modal" id="medModal"><div class="sheet"><div class="sheethead"><button class="x" data-close="medModal">×</button><h2>添加药物</h2><button class="x" id="saveMed">✓</button></div><div class="field"><label>药物名称</label><input id="medName" placeholder="例如 肾脏药"></div><div class="formgrid"><div class="field"><label>剂量</label><input id="medDose" placeholder="1粒"></div><div class="field"><label>频率</label><select id="medFreq"><option value="daily">每天</option><option value="bid">每天两次</option><option value="hours">每12小时</option><option value="alt">隔天</option></select></div></div><div class="field"><label>时间</label><input id="medTimes" placeholder="08:00, 20:00"></div><div class="formgrid"><div class="field"><label>开始日期</label><input id="medStart" type="date"></div><div class="field"><label>状态</label><select id="medActive"><option value="1">使用中</option><option value="0">已停用</option></select></div></div><button class="primary pink" id="saveMed2">保存</button></div></div><div class="modal" id="petModal"><div class="sheet"><div class="sheethead"><button class="x" data-close="petModal">×</button><h2>猫咪资料</h2><button class="x" id="savePet">✓</button></div><div class="field"><label>名字</label><input id="petName"></div><div class="formgrid"><div class="field"><label>体重</label><input id="petWeight" placeholder="5.2kg"></div><div class="field"><label>年龄</label><input id="petAge" placeholder="8岁"></div></div></div></div><div class="toast" id="toast">已保存</div><script>const K='cat-health-assistant-v1',oldK='cat-care-local-v3';let today=new Date,sel=dayKey(today),filter='all',tmp={amount:'正常',color:'浅黄'};const $=id=>document.getElementById(id),fmtD=new Intl.DateTimeFormat('zh-CN',{month:'long',day:'numeric',weekday:'short'}),fmtT=new Intl.DateTimeFormat('zh-CN',{hour:'2-digit',minute:'2-digit'});function dayKey(d=new Date){return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')}function dtLocal(d=new Date){return dayKey(d)+'T'+String(d.getHours()).padStart(2,'0')+':'+String(d.getMinutes()).padStart(2,'0')}function id(p){return p+Date.now()+Math.random().toString(16).slice(2)}function load(){try{let v=localStorage.getItem(K);if(v)return JSON.parse(v);let old=localStorage.getItem(oldK);if(old){let o=JSON.parse(old);return{pet:{name:o.cat||'咪咪',weight:'5.2kg',age:'8岁'},pees:(o.pees||[]).map(p=>({id:p.id,at:p.at,amount:'正常',color:p.color||'浅黄',note:p.note||''})),meds:(o.meds||[]).map(m=>({id:m.id,name:m.name,dose:m.dose,frequency:m.mode||'daily',times:m.times||'09:00',start:m.start||dayKey(),active:m.active!==false,note:m.note||''})),logs:(o.logs||[]).map(l=>({id:l.id,medId:l.mid,dueAt:l.due,status:l.status,at:l.at}))}}}catch{}return{pet:{name:'咪咪',weight:'5.2kg',age:'8岁'},pees:[],meds:[{id:id('m'),name:'肾脏药',dose:'1粒',frequency:'daily',times:'08:00',start:dayKey(),active:true,note:''},{id:id('m'),name:'消炎药',dose:'0.5粒',frequency:'daily',times:'20:00',start:dayKey(),active:true,note:''},{id:id('m'),name:'营养剂',dose:'1粒',frequency:'daily',times:'22:00',start:dayKey(),active:true,note:''}],logs:[]}}let data=load();function save(){localStorage.setItem(K,JSON.stringify(data));render()}function esc(s){return String(s||'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}function toast(t='已保存'){let el=$('toast');el.textContent=t;el.classList.add('on');setTimeout(()=>el.classList.remove('on'),1300)}function peesFor(d){return data.pees.filter(p=>p.at.slice(0,10)===d).sort((a,b)=>a.at.localeCompare(b.at))}function lastNDays(n){return Array.from({length:n},(_,i)=>{let d=new Date;d.setDate(d.getDate()-n+1+i);return dayKey(d)})}function medTimes(m,d){if(!m.active&&filter!=='stopped')return[];if(d<m.start)return[];let diff=Math.round((new Date(d)-new Date(m.start))/864e5);if(m.frequency==='alt'&&diff%2!==0)return[];let ts=(m.times||'09:00').split(',').map(x=>x.trim()).filter(Boolean);if(m.frequency==='bid'&&ts.length<2)ts=['08:00','20:00'];if(m.frequency==='hours')ts=['08:00','20:00'];return ts.map(t=>({med:m,time:t,dueAt:d+'T'+t+':00'}))}function todaysDoses(d=dayKey()){return data.meds.flatMap(m=>medTimes(m,d)).sort((a,b)=>a.dueAt.localeCompare(b.dueAt))}function logFor(dose){return data.logs.find(l=>l.medId===dose.med.id&&l.dueAt===dose.dueAt)}function go(page){document.querySelectorAll('.page').forEach(p=>p.classList.toggle('on',p.id===page));document.querySelectorAll('.tab').forEach(t=>t.classList.toggle('on',t.dataset.go===page))}document.body.addEventListener('click',e=>{let g=e.target.closest('[data-go]');if(g){go(g.dataset.go)}let c=e.target.closest('[data-close]');if(c)$(c.dataset.close).classList.remove('on');let dose=e.target.closest('[data-dose]');if(dose){let [mid,due,status]=dose.dataset.dose.split('|');data.logs=data.logs.filter(l=>!(l.medId===mid&&l.dueAt===due));data.logs.push({id:id('l'),medId:mid,dueAt:due,status,at:new Date().toISOString()});save();toast(status==='taken'?'已记录吃药':'已跳过')}});function openModal(id){$(id).classList.add('on')}function render(){let pet=data.pet;$('homeName').textContent=pet.name;$('petInfo').textContent='体重 '+(pet.weight||'--')+(pet.age?' · '+pet.age:'');let ps=peesFor(dayKey());$('todayCount').textContent=ps.length;$('rangeText').textContent=ps.length>=2&&ps.length<=6?'正常范围 ✓':ps.length?'请留意变化':'今天还没有记录';$('miniBars').innerHTML=lastNDays(5).map(d=>{let c=peesFor(d).length,h=18+Math.min(6,c)*10;return`<div class="bar" style="height:${h}px;opacity:${d===dayKey()?1:.45}"><b>${Number(d.slice(8))}</b></div>`}).join('');let doses=todaysDoses(),done=doses.filter(x=>logFor(x)?.status==='taken').length;$('medProgress').textContent=`${done}/${doses.length} 已完成`;$('homeMeds').innerHTML=doses.length?doses.map(d=>doseRow(d)).join(''):'<p class="empty">今天没有用药计划</p>';renderDates();renderPees();renderMeds();renderStats()}function doseRow(d){let l=logFor(d),cls=l?.status==='taken'?'✅':l?.status==='skipped'?'↷':'⏰';return`<div class="medrow"><span class="time">${d.time}</span><div style="flex:1"><b class="medname">${esc(d.med.name)}</b><p class="dose">${esc(d.med.dose)}</p></div><button class="ghost" data-dose="${d.med.id}|${d.dueAt}|taken">${cls}</button></div>`}function renderDates(){let ds=lastNDays(5);$('dates').innerHTML=ds.map(d=>`<button class="datepill ${d===sel?'on':''}" data-date="${d}">${Number(d.slice(5,7))}月${Number(d.slice(8))}日</button>`).join('');document.querySelectorAll('[data-date]').forEach(b=>b.onclick=()=>{sel=b.dataset.date;render()})}function renderPees(){let ps=peesFor(sel);$('peeList').innerHTML=ps.length?ps.map(p=>`<div class="recrow"><span class="water">💧</span><b class="time">${fmtT.format(new Date(p.at))}</b><span class="status">${esc(p.amount)}</span><span class="tiny">${esc(p.color)}</span></div>`).join(''):'<p class="empty">这天还没有记录</p>';$('sumCount').textContent=ps.length+' 次';$('avgGap').textContent=gapText(ps)}function gapText(ps){if(ps.length<2)return'--';let mins=[];for(let i=1;i<ps.length;i++)mins.push((new Date(ps[i].at)-new Date(ps[i-1].at))/6e4);let m=mins.reduce((a,b)=>a+b,0)/mins.length,h=Math.floor(m/60),mi=Math.round(m%60);return h?`${h}小时${mi}分钟`:`${mi}分钟`}function renderMeds(){let d=dayKey();$('medDate').textContent=fmtD.format(new Date(d+'T12:00:00'));let list=(filter==='active'?data.meds.filter(m=>m.active):filter==='stopped'?data.meds.filter(m=>!m.active):data.meds).flatMap(m=>filter==='stopped'?[{med:m,time:'--:--',dueAt:d+'T00:00:00'}]:medTimes(m,d));$('plan').innerHTML=list.length?list.map(d=>{let l=logFor(d),late=!l&&new Date(d.dueAt)<new Date;return`<div class="planrow"><div class="plantime ${late?'late':''}">${d.time}</div><div class="plancard"><span class="dot"></span><div><b>${esc(d.med.name)}</b><p class="tiny">${esc(d.med.dose)}</p></div><button class="ghost" data-dose="${d.med.id}|${d.dueAt}|taken">${l?.status==='taken'?'✓':'○'}</button></div></div>`}).join(''):'<p class="empty">没有药物</p>'}function renderStats(){let days=lastNDays(7),vals=days.map(d=>peesFor(d).length),max=Math.max(6,...vals),pts=vals.map((v,i)=>[18+i*47,130-v/max*108]);$('chartLine').setAttribute('points',pts.map(p=>p.join(',')).join(' '));$('chartDots').innerHTML=pts.map((p,i)=>`<circle cx="${p[0]}" cy="${p[1]}" r="5" fill="#8c6cf1"/><text x="${p[0]}" y="${p[1]-10}" text-anchor="middle" font-size="12" fill="#7c edModal')};$('saveMed').onclick=$('saveMed2').onclick=()=>{if(!$('medName').value.trim())return toast('先填药名');data.meds.push({id:id('m'),name:$('medName').value.trim(),dose:$('medDose').value.trim(),frequency:$('medFreq').value,times:$('medTimes').value.trim()||'08:00',start:$('medStart').value||dayKey(),active:$('medActive').value==='1',note:''});$('medModal').classList.remove('on');save();toast('药物已添加')};document.querySelectorAll('.seg [data-filter]').forEach(b=>b.onclick=()=>{filter=b.dataset.filter;document.querySelectorAll('.seg [data-filter]').forEach(x=>x.classList.toggle('on',x===b));renderMeds()});$('editPet').onclick=()=>{$('petName').value=data.pet.name;$('petWeight').value=data.pet.weight;$('petAge').value=data.pet.age;openModal('petModal')};$('savePet').onclick=()=>{data.pet={name:$('petName').value||'咪咪',weight:$('petWeight').value,age:$('petAge').value};$('petModal').classList.remove('on');save()};function dl(n,c,t){let b=new Blob([c],{type:t}),u=URL.createObjectURL(b),a=document.createElement('a');a.href=u;a.download=n;a.click();URL.revokeObjectURL(u)}$('exportData').onclick=()=>dl('cat-care-data-'+dayKey()+'.json',JSON.stringify(data,null,2),'application/json');$('exportIcs').onclick=()=>{let lines=['BEGIN:VCALENDAR','VERSION:2.0','PRODID:-//Pet Health Assistant//CN'],stamp=new Date().toISOString().replace(/[-:]/g,'').split('.')[0]+'Z';data.meds.filter(m=>m.active).forEach(m=>medTimes(m,m.start).forEach((d,i)=>{let st=new Date(d.dueAt),en=new Date(st.getTime()+9e5),f=x=>x.toISOString().replace(/[-:]/g,'').replace(/\.\d{3}/,'');let rule=m.frequency==='alt'?'FREQ=DAILY;INTERVAL=2':'FREQ=DAILY';lines.push('BEGIN:VEVENT','UID:'+m.id+i+'@pet-health','DTSTAMP:'+stamp,'DTSTART:'+f(st),'DTEND:'+f(en),'RRULE:'+rule,'BEGIN:VALARM','TRIGGER:-PT10M','ACTION:DISPLAY','DESCRIPTION:该吃药了：'+m.name+' '+m.dose,'END:VALARM','SUMMARY:猫咪吃药：'+m.name,'DESCRIPTION:'+m.dose,'END:VEVENT')}));lines.push('END:VCALENDAR');dl('cat-medicine-reminders.ics',lines.join('\r\n'),'text/
