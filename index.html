<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>猫咪照护记录</title><style>:root{--ink:#17221d;--muted:#65736c;--line:#dfe7df;--paper:#fffdf7;--gold:#f7c548;--coral:#e86f56;--blue:#4f82bd;--mint:#83b59b}*{box-sizing:border-box}body{margin:0;background:linear-gradient(135deg,#fffdf7,#eef7f2 55%,#f8f4e5);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"PingFang SC",system-ui,sans-serif}.app{max-width:980px;margin:auto;padding:max(16px,env(safe-area-inset-top)) 12px max(24px,env(safe-area-inset-bottom))}button,input,select{font:inherit}button{min-height:44px;border:0;border-radius:8px;background:var(--ink);color:white;padding:0 14px;font-weight:800}input,select{width:100%;min-height:44px;border:1px solid var(--line);border-radius:8px;background:#ffffffd9;padding:0 12px}.top,.head,.row,.actions,.card{display:flex;gap:10px;align-items:center}.top{justify-content:space-between}.top div{width:min(260px,58vw)}label{display:block;color:var(--muted);font-size:.82rem;font-weight:800;margin-bottom:6px}.ghost,.quiet{background:#ffffffbd;color:var(--ink);border:1px solid var(--line)}.hero{margin:14px 0;padding:26px;border-radius:8px;background:linear-gradient(120deg,#17221d,#335646);color:white;display:flex;justify-content:space-between;gap:16px}.hero p,.hero h1{margin:0}.hero h1{font-size:clamp(2rem,9vw,5rem);line-height:.96}.stats{display:flex;gap:8px;flex-wrap:wrap;align-self:end;justify-content:flex-end}.stats span{border:1px solid #ffffff38;border-radius:8px;background:#ffffff1a;padding:10px 12px;font-weight:800}.tabs{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;border:1px solid var(--line);border-radius:8px;background:#ffffff99;padding:5px;margin-bottom:14px}.tabs button{background:transparent;color:var(--muted)}.tabs .on{background:var(--gold);color:var(--ink)}.grid{display:grid;grid-template-columns:minmax(280px,.9fr) minmax(320px,1.1fr);gap:14px}.panel,.primary{border:1px solid #19231f17;border-radius:8px;background:#ffffffb8;padding:16px;box-shadow:0 14px 40px #3d524817}.primary{display:grid;gap:12px;align-content:start}.pee{min-height:170px;background:linear-gradient(135deg,var(--gold),var(--coral));color:#25180e;font-size:clamp(2.2rem,11vw,4.7rem);line-height:1}.list,.fields,.meds{display:grid;gap:10px}.head{justify-content:space-between;margin-bottom:12px}h2,h3{margin:0}.item,.record,.med{border:1px solid var(--line);border-radius:8px;background:#ffffffcc;padding:12px}.item,.record{justify-content:space-between}.item time,.record time{color:var(--blue);font-size:1.25rem;font-weight:900}.muted,.item p,.record p,.record span,.med footer{color:var(--muted)}.item p,.record p{margin:4px 0}.taken{border-color:#83b59bb3;background:#83b59b29}.skipped{border-color:#e86f568a;background:#e86f561a}.wide{max-width:820px;margin:auto}.add{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-bottom:14px}.med{display:grid;gap:10px}.med footer{justify-content:space-between}.danger{background:var(--coral)}.hide{display:none}@media(max-width:760px){.top,.hero,.grid,.item,.record,.head,.med footer{display:grid}.grid{grid-template-columns:1fr}.row,.actions{flex-wrap:wrap}.actions button{flex:1 1 120px}.add{grid-template-columns:1fr}}</style></head><body><main class="app"><section class="top"><div><label>猫咪名字</label><input id="cat"></div><button id="export" class="ghost">导出记录</button></section><section class="hero"><div><p id="day"></p><h1><span id="name"></span>今天照护</h1></div><div class="stats"><span id="count"></span><span id="last"></span></div></section><nav class="tabs"><button class="on" data-tab="today">今天</button><button data-tab="history">历史</button><button data-tab="meds">药物</button></nav><section id="today"><div class="grid"><section class="primary"><button id="pee" class="pee">刚刚尿尿</button><div class="fields"><select id="color"><option value="正常">看起来正常</option><option value="尿量偏少">尿量偏少</option><option value="颜色偏深">颜色偏深</option><option value="粉/红色">粉/红色</option><option value="排尿费力">排尿费力</option></select><input id="note" placeholder="备注，可不填"></div></section><section class="panel"><div class="head"><h2>今天该吃的药</h2><button id="addMed1">新增药</button></div><div id="doses" class="list"></div></section><section class="panel"><h2>今天尿尿记录</h2><div id="todayList" class="list"></div></section></div></section><section id="history" class="panel wide hide"><div class="head"><h2>按天查看</h2><input type="date" id="selDay"></div><form id="back" class="add"><input type="date" id="backD"><input type="time" id="backT"><input id="backN" placeholder="补录备注"><button>补录尿尿</button></form><div id="histList" class="list"></div></section><section id="meds" class="panel wide hide"><div class="head"><h2>药物设置</h2><div class="actions"><button id="addMed2">新增药</button><button id="ics" class="ghost">导出日历提醒</button></div></div><div id="medList" class="meds"></div></section></main><script>const K='cat-care-local-v3',fmtD=new Intl.DateTimeFormat('zh-CN',{month:'long',day:'numeric',weekday:'short'}),fmtT=new Intl.DateTimeFormat('zh-CN',{hour:'2-digit',minute:'2-digit'});let S={tab:'today',day:key(),data:load()};function key(d=new Date()){return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')}function now(){let d=new Date;return key(d)+'T'+String(d.getHours()).padStart(2,'0')+':'+String(d.getMinutes()).padStart(2,'0')+':'+String(d.getSeconds()).padStart(2,'0')}function id(p){return p+'-'+Date.now()+'-'+Math.random().toString(16).slice(2)}function load(){try{let x=localStorage.getItem(K);if(x)return JSON.parse(x)}catch{}return{cat:'小猫',pees:[],meds:[{id:id('m'),name:'示例药物',dose:'按医嘱填写',mode:'daily',times:'09:00,21:00',hours:12,start:key(),end:'',food:'饭后',note:'可删除或改成真实药名'}],logs:[]}}function save(){localStorage.setItem(K,JSON.stringify(S.data));render()}function esc(s){return String(s||'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}function inRange(day,m){if(day<m.start)return false;if(m.end&&day>m.end)return false;if(m.mode!=='alt')return true;return Math.round((new Date(day)-new Date(m.start))/864e5)%2===0}function times(m,day){if(!inRange(day,m))return[];if(m.mode==='hours'){let out=[],t=(m.times.split(',')[0]||'09:00').trim(),d=new Date(day+'T'+t+':00');while(key(d)===day){out.push(d.toTimeString().slice(0,5));d=new Date(d.getTime()+Number(m.hours||12)*36e5)}return out}return m.times.split(',').map(x=>x.trim()).filter(Boolean).sort()}function pees(day){return S.data.pees.filter(p=>p.at.slice(0,10)===day).sort((a,b)=>b.at.localeCompare(a.at))}function renderList(el,arr){el.innerHTML=arr.length?arr.map(p=>`<article class="record"><div><time>${fmtT.format(new Date(p.at))}</time><p>${esc(p.note)||'无备注'}</p><span>${esc(p.color)}</span></div><button data-delpee="${p.id}">删除</button></article>`).join(''):'<p class="muted">还没有记录。</p>'}function renderDoses(){let ds=S.data.meds.flatMap(m=>times(m,S.day).map(t=>{let due=S.day+'T'+t+':00',log=S.data.logs.find(l=>l.mid===m.id&&l.due===due);return{m,t,due,log}})).sort((a,b)=>a.due.localeCompare(b.due));doses.innerHTML=ds.length?ds.map(x=>`<article class="item ${x.log?x.log.status:''}"><div><time>${x.t}</time><h3>${esc(x.m.name)}</h3><p>${esc(x.m.dose)||'未填写剂量'} · ${esc(x.m.food||'无特殊')}</p></div><div class="actions"><button data-dose="${x.m.id}|${x.due}|taken">已吃</button><button class="quiet" data-dose="${x.m.id}|${x.due}|skipped">跳过</button></div></article>`).join(''):'<p class="muted">这一天没有设置药物。</p>'}function renderMeds(){medList.innerHTML=S.data.meds.map(m=>`<article class="med" data-med="${m.id}"><input data-f="name" value="${esc(m.name)}" placeholder="药名"><input data-f="dose" value="${esc(m.dose)}" placeholder="剂量，例如 1/4 片"><div class="row"><select data-f="mode"><option value="daily" ${m.mode==='daily'?'selected':''}>每天</option><option value="hours" ${m.mode==='hours'?'selected':''}>每隔几小时</option><option value="alt" ${m.mode==='alt'?'selected':''}>隔天</option></select><input data-f="${m.mode==='hours'?'hours':'times'}" type="${m.mode==='hours'?'number':'text'}" value="${m.mode==='hours'?m.hours:esc(m.times)}"></div><div class="row"><input data-f="start" type="date" value="${m.start}"><input data-f="end" type="date" value="${m.end}"></div><div class="row"><select data-f="food"><option ${m.food==='无特殊'?'selected':''}>无特殊</option><option ${m.food==='饭前'?'selected':''}>饭前</option><option ${m.food==='饭后'?'selected':''}>饭后</option></select><input data-f="note" value="${esc(m.note)}" placeholder="备注"></div><footer class="row"><span>${m.mode==='hours'?'每 '+m.hours+' 小时':m.mode==='alt'?'隔天':'每天'} · ${esc(m.mode==='hours'?(m.hours+' 小时间隔'):m.times)}</span><button class="danger" data-delmed="${m.id}">删除</button></footer></article>`).join('')}function render(){cat.value=S.data.cat;name.textContent=S.data.cat||'小猫';selDay.value=S.day;backD.value=S.day;backT.value=new Date().toTimeString().slice(0,5);day.textContent=fmtD.format(new Date(S.day+'T12:00:00'));let ps=pees(S.day),lastp=[...S.data.pees].sort((a,b)=>b.at.localeCompare(a.at))[0];count.textContent='尿尿 '+ps.length+' 次';last.textContent=lastp?'距上次 '+Math.max(0,(Date.now()-new Date(lastp.at))/36e5).toFixed(1)+' 小时':'还没有记录';renderDoses();renderList(todayList,ps);renderList(histList,ps);renderMeds()}function tab(t){S.tab=t;document.querySelectorAll('.tabs button').forEach(b=>b.classList.toggle('on',b.dataset.tab===t));['today','history','meds'].forEach(x=>document.getElementById(x).classList.toggle('hide',x!==t));render()}function addMed(){S.data.meds.push({id:id('m'),name:'新药',dose:'',mode:'daily',times:'09:00',hours:12,start:key(),end:'',food:'无特殊',note:''});tab('meds');save()}document.querySelectorAll('.tabs button').forEach(b=>b.onclick=()=>tab(b.dataset.tab));cat.oninput=e=>{S.data.cat=e.target.value;save()};selDay.oninput=e=>{S.day=e.target.value;render()};pee.onclick=()=>{S.data.pees.unshift({id:id('p'),at:now(),note:note.value.trim(),color:color.value});S.day=key();note.value='';color.value='正常';save()};back.onsubmit=e=>{e.preventDefault();if(!backD.value||!backT.value)return;S.data.pees.unshift({id:id('p'),at:backD.value+'T'+backT.value+':00',note:backN.value.trim(),color:'正常'});S.day=backD.value;backN.value='';save()};addMed1.onclick=addMed;addMed2.onclick=addMed;document.body.onclick=e=>{let p=e.target.dataset.delpee,m=e.target.dataset.delmed,d=e.target.dataset.dose;if(p){S.data.pees=S.data.pees.filter(x=>x.id!==p);save()}if(m){S.data.meds=S.data.meds.filter(x=>x.id!==m);S.data.logs=S.data.logs.filter(x=>x.mid!==m);save()}if(d){let[a,b,c]=d.split('|');S.data.logs=S.data.logs.filter(x=>!(x.mid===a&&x.due===b));S.data.logs.push({id:id('l'),mid:a,due:b,at:now(),status:c});save()}};medList.oninput=e=>{let card=e.target.closest('[data-med]'),m=S.data.meds.find(x=>x.id===card?.dataset.med),f=e.target.dataset.f;if(!m||!f)return;m[f]=f==='hours'?Number(e.target.value||1):e.target.value;localStorage.setItem(K,JSON.stringify(S.data));render()};function dl(n,c,t){let b=new Blob([c],{type:t}),u=URL.createObjectURL(b),a=document.createElement('a');a.href=u;a.download=n;a.click();URL.revokeObjectURL(u)}export.onclick=()=>dl('cat-care-'+key()+'.json',JSON.stringify(S.data,null,2),'application/json');ics.onclick=()=>{let lines=['BEGIN:VCALENDAR','VERSION:2.0','PRODID:-//Cat Care//CN'],stamp=new Date().toISOString().replace(/[-:]/g,'').split('.')[0]+'Z';S.data.meds.forEach(m=>times(m,m.start).forEach((t,i)=>{let st=new Date(m.start+'T'+t+':00'),en=new Date(st.getTime()+9e5),f=d=>d.toISOString().replace(/[-:]/g,'').replace(/\.\d{3}/,'');let until=m.end?';UNTIL='+m.end.replace(/-/g,'')+'T235900':'';let rule=m.mode==='alt'?'FREQ=DAILY;INTERVAL=2'+until:m.mode==='hours'?'FREQ=HOURLY;INTERVAL='+m.hours+until:'FREQ=DAILY'+until;lines.push('BEGIN:VEVENT','UID:'+m.id+'-'+i+'@cat-care','DTSTAMP:'+stamp,'DTSTART:'+f(st),'DTEND:'+f(en),'RRULE:'+rule,'BEGIN:VALARM','TRIGGER:-PT5M','ACTION:DISPLAY','DESCRIPTION:该给猫吃药了：'+m.name+' '+m.dose,'END:VALARM','SUMMARY:猫咪吃药：'+m.name,'DESCRIPTION:'+m.dose+'；'+m.food+'；'+m.note,'END:VEVENT')}));lines.push('END:VCALENDAR');dl('cat-medicine-reminders.ics',lines.join('\r\n'),'text/calendar')};render();</script></body></html>
