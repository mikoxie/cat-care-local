<div class="modal" id="peeModal"><div class="sheet"><div class="sheetHead"><button class="x" data-close="peeModal">×</button><h2>添加尿尿记录</h2><button class="x" id="savePee">✓</button></div><div class="field"><label>时间</label><input id="peeTime" type="datetime-local"></div><div class="field"><label>尿量</label><div class="chips" id="amountChips"><button class="chip" data-v="少">💧<br>少</button><button class="chip on" data-v="正常">💧<br>正常</button><button class="chip" data-v="多">💧<br>多</button></div></div><div class="field"><label>备注</label><textarea id="peeNote" placeholder="可选，记录异常情况..."></textarea></div></div></div>
<div class="modal" id="medModal"><div class="sheet"><div class="sheetHead"><button class="x" data-close="medModal">×</button><h2 id="medModalTitle">添加药物</h2><button class="x" id="saveMed">✓</button></div><input id="editMedId" type="hidden"><div class="card"><div class="field"><label>药物名称</label><input id="medName" placeholder="例如 胺肾、消炎药"></div><div class="formgrid"><div class="field"><label>数量/剂量</label><input id="medDose" placeholder="1个、0.5粒"></div><div class="field"><label>状态</label><select id="medActive"><option value="1">使用中</option><option value="0">已停用</option></select></div></div><div class="field"><label>颜色标记</label><div class="colors" id="medColors"><button class="colorChoice on" data-color="#1683ff"><span class="colorDot" style="background:#1683ff"></span>蓝</button><button class="colorChoice" data-color="#f27f80"><span class="colorDot" style="background:#f27f80"></span>粉</button><button class="colorChoice" data-color="#9aa9e8"><span class="colorDot" style="background:#9aa9e8"></span>紫</button><button class="colorChoice" data-color="#47be7d"><span class="colorDot" style="background:#47be7d"></span>绿</button></div></div></div><div class="card"><h3>用药安排</h3><div class="field"><label>频率</label><select id="medFreq"><option value="daily">每天</option><option value="bid">每天两次</option><option value="hours">每12小时</option><option value="interval">每 N 天</option><option value="alt">隔天</option><option value="prn">按需服用</option></select></div><div class="formgrid"><div class="field"><label>间隔天数</label><input id="medInterval" type="number" min="2" value="7"></div><div class="field"><label>时间</label><input id="medTimes" placeholder="08:00, 20:00"></div></div><div class="formgrid"><div class="field"><label>开始日期</label><input id="medStart" type="date"></div><div class="field"><label>结束日期（可选）</label><input id="medEnd" type="date"></div></div></div><div class="card"><div class="field"><label>备注</label><textarea id="medNote" placeholder="可选，写注意事项或医嘱"></textarea></div></div><button class="danger" id="deleteMed" style="display:none">删除药物</button></div></div>
<div class="modal" id="petModal"><div class="sheet"><div class="sheetHead"><button class="x" data-close="petModal">×</button><h2>猫咪资料</h2><button class="x" id="savePet">✓</button></div><div class="field"><label>名字</label><input id="petName"></div><div class="formgrid"><div class="field"><label>体重</label><input id="petWeight" placeholder="5.2kg"></div><div class="field"><label>年龄</label><input id="petAge" placeholder="8岁"></div></div></div></div>
<div class="toast" id="toast">已保存</div>
<script>
const K='cat-health-assistant-v1',oldK='cat-care-local-v3';let sel=dayKey(),filter='all',tmp={amount:'正常'},medColor='#1683ff';const $=id=>document.getElementById(id),fmtD=new Intl.DateTimeFormat('zh-CN',{month:'long',day:'numeric',weekday:'long'}),fmtT=new Intl.DateTimeFormat('zh-CN',{hour:'2-digit',minute:'2-digit'});
function dayKey(d=new Date){return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')}function dtLocal(d=new Date){return dayKey(d)+'T'+String(d.getHours()).padStart(2,'0')+':'+String(d.getMinutes()).padStart(2,'0')}function uid(p){return p+Date.now()+Math.random().toString(16).slice(2)}function esc(s){return String(s||'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}
function load(){try{let v=localStorage.getItem(K);if(v){let d=JSON.parse(v);d.meds=(d.meds||[]).map(m=>({...m,color:m.color||'#1683ff',interval:m.interval||7,end:m.end||'',note:m.note||''}));d.pees=(d.pees||[]).map(p=>({...p,amount:p.amount||'正常'}));return d}let old=localStorage.getItem(oldK);if(old){let o=JSON.parse(old);return{pet:{name:o.cat||'咪咪',weight:'5.2kg',age:'8岁'},pees:(o.pees||[]).map(p=>({id:p.id,at:p.at,amount:p.amount||'正常',note:p.note||''})),meds:(o.meds||[]).map(m=>({id:m.id,name:m.name,dose:m.dose,frequency:m.mode||'daily',times:m.times||'09:00',start:m.start||dayKey(),end:'',interval:7,active:m.active!==false,note:m.note||'',color:'#1683ff'})),logs:(o.logs||[]).map(l=>({id:l.id,medId:l.mid,dueAt:l.due,status:l.status,at:l.at}))}}}catch{}return{pet:{name:'咪咪',weight:'5.2kg',age:'8岁'},pees:[],meds:[{id:uid('m'),name:'肾脏药',dose:'1粒',frequency:'daily',times:'08:00',start:dayKey(),end:'',interval:7,active:true,note:'',color:'#9aa9e8'},{id:uid('m'),name:'消炎药',dose:'0.5粒',frequency:'daily',times:'20:00',start:dayKey(),end:'',interval:7,active:true,note:'',color:'#f27f80'},{id:uid('m'),name:'营养剂',dose:'1粒',frequency:'daily',times:'22:00',start:dayKey(),end:'',interval:7,active:true,note:'',color:'#47be7d'}],logs:[]}}
let data=load();function save(){localStorage.setItem(K,JSON.stringify(data));render()}function toast(t='已保存'){let el=$('toast');el.textContent=t;el.classList.add('on');setTimeout(()=>el.classList.remove('on'),1300)}function peesFor(d){return data.pees.filter(p=>p.at.slice(0,10)===d).sort((a,b)=>a.at.localeCompare(b.at))}function lastNDays(n){return Array.from({length:n},(_,i)=>{let d=new Date;d.setDate(d.getDate()-n+1+i);return dayKey(d)})}
function medTimes(m,d){if(m.frequency==='prn')return[];if(!m.active&&filter!=='stopped')return[];if(d<m.start)return[];if(m.end&&d>m.end)return[];let diff=Math.round((new Date(d+'T00:00:00')-new Date(m.start+'T00:00:00'))/864e5);if(m.frequency==='alt'&&diff%2!==0)return[];if(m.frequency==='interval'&&diff%(Number(m.interval)||7)!==0)return[];let ts=(m.times||'09:00').split(',').map(x=>x.trim()).filter(Boolean);if(m.frequency==='bid'&&ts.length<2)ts=['08:00','20:00'];if(m.frequency==='hours')ts=['08:00','20:00'];return ts.map(t=>({med:m,time:t,dueAt:d+'T'+t+':00'}))}function dosesFor(d=dayKey()){return data.meds.flatMap(m=>medTimes(m,d)).sort((a,b)=>a.dueAt.localeCompare(b.dueAt))}function logFor(d){return data.logs.find(l=>l.medId===d.med.id&&l.dueAt===d.dueAt)}
function agoText(){let taken=data.logs.filter(l=>l.status==='taken').sort((a,b)=>b.at.localeCompare(a.at))[0];if(!taken)return'还没有服药记录';let ms=Date.now()-new Date(taken.at).getTime(),m=Math.max(0,Math.round(ms/60000)),h=Math.floor(m/60),mi=m%60;return '距离上次服用已过 '+(h?`${h}小时${mi}分钟`:`${mi}分钟`)}function go(page){document.querySelectorAll('.page').forEach(p=>p.classList.toggle('on',p.id===page));document.querySelectorAll('.tab').forEach(t=>t.classList.toggle('on',t.dataset.go===page))}
document.body.addEventListener('click',e=>{let slot=e.target.closest('[data-pee-slot]');if(slot){togglePeeSlot(slot.dataset.peeSlot);return}let pee=e.target.closest('[data-pee-id]');if(pee){if(confirm('删除这条尿尿记录吗？')){data.pees=data.pees.filter(p=>p.id!==pee.dataset.peeId);save();toast('尿尿记录已删除')}return}let d=e.target.closest('[data-dose]');if(d){let[mid,due,status]=d.dataset.dose.split('|');data.logs=data.logs.filter(l=>!(l.medId===mid&&l.dueAt===due));if(status!=='clear')data.logs.push({id:uid('l'),medId:mid,dueAt:due,status,at:new Date().toISOString()});save();toast(status==='clear'?'已取消本次记录':'已记录吃药');return}let toggle=e.target.closest('[data-toggle-med]');if(toggle){let m=data.meds.find(x=>x.id===toggle.dataset.toggleMed);if(m){m.active=!m.active;save();toast(m.active?'已启用':'已停用')}return}let edit=e.target.closest('[data-edit-med]');if(edit){openMedEdit(edit.dataset.editMed);return}let g=e.target.closest('[data-go]');if(g)go(g.dataset.go);let c=e.target.closest('[data-close]');if(c)$(c.dataset.close).classList.remove('on')});
function render(){let pet=data.pet;$('homeName').textContent=pet.name;$('petInfo').textContent=(pet.age||'8岁')+' · 体重 '+(pet.weight||'--');$('homeDate').textContent=fmtD.format(new Date(dayKey()+'T12:00:00'));let ps=peesFor(dayKey());$('todayCount').textContent=ps.length;$('rangeText').textContent=ps.length>=2&&ps.length<=6?'正常范围 ✓':ps.length?'请留意变化':'今天还没有记录';renderPeeSlots(ps);let ds=dosesFor(),done=ds.filter(x=>logFor(x)?.status==='taken').length;$('todayTaken').textContent=`${done}/${ds.length} 次`;$('medProgressHome').textContent=`${done}/${ds.length} 已完成`;$('lastTaken').textContent=agoText();$('homeMeds').innerHTML=ds.length?ds.map(homeDoseRow).join(''):'<div class="empty">今天没有用药计划</div>';renderDates();renderPees();renderMeds();renderStats()}
function renderPeeSlots(ps){let slots=['00','02','04','06','08','10','12','14','16','18','20','22'];$('peeSlots').innerHTML=slots.map(h=>{let on=ps.some(p=>p.at.slice(11,13)===h);return`<button class="peeSlot ${on?'done':''}" data-pee-slot="${h}">${h}时</button>`}).join('')}function togglePeeSlot(h){let d=dayKey(),idx=data.pees.findIndex(p=>p.at.slice(0,10)===d&&p.at.slice(11,13)===h);if(idx>=0){data.pees.splice(idx,1);save();toast(h+'时记录已取消');return}data.pees.push({id:uid('p'),at:d+'T'+h+':00:00',amount:'正常',note:''});sel=d;save();toast(h+'时尿尿已记录')}function doseState(d){let l=logFor(d);if(l?.status==='taken')return'taken';return new Date(d.dueAt)<new Date?'late':'pending'}function homeDoseRow(d){let s=doseState(d),next=s==='taken'?'clear':'taken',label=s==='taken'?'取消本次用药记录':'记录本次已吃',late=s==='late',bottle=late?'🧴':'💊';return`<div class="homeMedPlan ${s}"><div class="homeMedTime ${late?'late':''}">${d.time}</div><div class="rail"><span class="railDot ${late?'now':''}"></span></div><div class="bottle">${bottle}</div><div class="main"><div class="homeMedName">${esc(d.med.name)}</div><p class="homeMedDose">${esc(d.med.dose||'')}</p><p class="homeMedStatus ${late?'late':''}">${s==='taken'?'已完成':'待服用'}</p></div><button class="homeCheck ${s}" aria-label="${label}" data-dose="${d.med.id}|${d.dueAt}|${next}">${s==='taken'?'✓':''}</button></div>`}function doseButton(d){let s=doseState(d),next=s==='taken'?'clear':'taken',label=s==='taken'?'取消本次用药记录':'记录本次已吃';return`<button class="check ${s}" aria-label="${label}" title="${label}" data-dose="${d.med.id}|${d.dueAt}|${next}">${s==='taken'?'✓':''}</button>`}function doseRow(d,editable=true){let s=doseState(d),hint=s==='taken'?'已完成，点圆圈可取消':s==='late'?'待服用':'待服用',edit=editable?` data-edit-med="${d.med.id}"`:'';return`<div class="medRow" data-time="${d.time}"><span class="timePill ${s}">${d.time}</span><div class="medCard ${s}"${edit}><span class="stripe" style="background:${d.med.color||'#1683ff'}"></span><div class="main"><div class="name">${esc(d.med.name)}</div><p class="dose">${esc(d.med.dose||'')}</p><p class="medHint">${hint}</p></div>${doseButton(d)}</div></div>`}function insertNow(html,ds){let now=new Date(),t=String(now.getHours()).padStart(2,'0')+':'+String(now.getMinutes()).padStart(2,'0'),i=ds.findIndex(d=>d.time>t),line=`<div class="nowLine"><b>${t}</b></div>`;if(i<0)return html+line;let parts=html.split('</div></div>');return parts.map((p,idx)=>p&&(p+'</div></div>')).slice(0,i).join('')+line+parts.map((p,idx)=>p&&(p+'</div></div>')).slice(i).join('')}
function renderDates(){let ds=lastNDays(5);$('dates').innerHTML=ds.map(d=>`<button class="datePill ${d===sel?'on':''}" data-date="${d}">${Number(d.slice(5,7))}月${Number(d.slice(8))}日</button>`).join('');document.querySelectorAll('[data-date]').forEach(b=>b.onclick=()=>{sel=b.dataset.date;render()})}function gapText(ps){if(ps.length<2)return'--';let mins=[];for(let i=1;i<ps.length;i++)mins.push((new Date(ps[i].at)-new Date(ps[i-1].at))/6e4);let m=mins.reduce((a,b)=>a+b,0)/mins.length,h=Math.floor(m/60),mi=Math.round(m%60);return h?`${h}小时${mi}分钟`:`${mi}分钟`}
function renderPees(){let ps=peesFor(sel);$('peeList').innerHTML=ps.length?ps.map(p=>`<button class="peeRecord" data-pee-id="${p.id}"><span class="peeRecordTime">${fmtT.format(new Date(p.at))}</span><span class="peeBadge">${esc(p.amount||'正常')}</span></button>`).join(''):'<p class="empty">这天还没有记录</p>';$('sumCount').textContent=ps.length+'次';$('sumCount2').textContent=ps.length+'次';$('avgGap').textContent=gapText(ps)}
function freqLabel(m){let map={daily:'每天',bid:'每天两次',hours:'每12小时',alt:'隔天',prn:'按需服用'};return m.frequency==='interval'?`每 ${m.interval||7} 天`:map[m.frequency]||'每天'}function medManageCard(m){let times=m.frequency==='prn'?'无固定时间':(m.times||'09:00'),date=m.end?`${m.start} 至 ${m.end}`:`${m.start} 起`;return`<div class="manageCard ${m.active?'':'off'}" data-edit-med="${m.id}"><span class="stripe" style="background:${m.color||'#1683ff'}"></span><div class="main"><div class="name">${esc(m.name)}</div><p class="dose">${esc(m.dose||'未填写剂量')}</p><div class="manageMeta"><span class="pill">${freqLabel(m)}</span><span class="pill">${esc(times)}</span><span class="pill">${date}</span></div></div><button class="switch ${m.active?'on':''}" aria-label="${m.active?'停用':'启用'}${esc(m.name)}" data-toggle-med="${m.id}"></button></div>`}function renderMeds(){let meds=filter==='active'?data.meds.filter(m=>m.active):filter==='stopped'?data.meds.filter(m=>!m.active):data.meds;$('plan').innerHTML=meds.length?meds.map(medManageCard).join(''):'<p class="empty">还没有药物</p>'}
function renderStats(){let days=lastNDays(7),vals=days.map(d=>peesFor(d).length),max=Math.max(6,...vals),pts=vals.map((v,i)=>[18+i*47,130-v/max*108]);$('chartLine').setAttribute('points',pts.map(p=>p.join(',')).join(' '));$('chartDots').innerHTML=pts.map((p,i)=>`<circle cx="${p[0]}" cy="${p[1]}" r="5" fill="#8c6cf1"/><text x="${p[0]}" y="${p[1]-10}" text-anchor="middle" font-size="12" fill="#7c7590">${vals[i]}</text>`).join('');$('chartGrid').innerHTML=[0,1,2,3].map(i=>`<line x1="10" x2="310" y1="${25+i*35}" y2="${25+i*35}" stroke="#eeeaf7"/>`).join('');$('avgDay').textContent=(vals.reduce((a,b)=>a+b,0)/7).toFixed(1);let all=data.pees.slice().sort((a,b)=>a.at.localeCompare(b.at));$('avgAllGap').textContent=gapText(all);let week=days.flatMap(d=>dosesFor(d)),taken=week.filter(d=>logFor(d)?.status==='taken').length,rate=week.length?Math.round(taken/week.length*100):0;$('rateRing').textContent=rate+'%';$('rateRing').style.background=`conic-gradient(var(--purple) 0 ${rate*3.6}deg,#eee9fb 0)`;$('missed').textContent=week.filter(d=>!logFor(d)&&new Date(d.dueAt)<new Date).length}
function openPee(){tmp={amount:'正常'};$('peeTime').value=dtLocal();$('peeNote').value='';document.querySelectorAll('#amountChips .chip').forEach(b=>b.classList.toggle('on',b.dataset.v==='正常'));$('peeModal').classList.add('on')}$('quickPee').onclick=$('openPee2').onclick=$('openPee3').onclick=openPee;$('amountChips').onclick=e=>{let b=e.target.closest('.chip');if(!b)return;tmp.amount=b.dataset.v;document.querySelectorAll('#amountChips .chip').forEach(x=>x.classList.toggle('on',x===b))};$('savePee').onclick=()=>{data.pees.push({id:uid('p'),at:$('peeTime').value?$('peeTime').value+':00':new Date().toISOString(),amount:tmp.amount,note:$('peeNote').value.trim()});$('peeModal').classList.remove('on');sel=dayKey(new Date(data.pees[data.pees.length-1].at));save();toast('尿尿已记录')};
function openMedEdit(id){let m=id?data.meds.find(x=>x.id===id):null;$('medModalTitle').textContent=m?'编辑药物':'添加药物';$('editMedId').value=m?.id||'';$('medName').value=m?.name||'';$('medDose').value=m?.dose||'';$('medFreq').value=m?.frequency||'daily';$('medInterval').value=m?.interval||7;$('medTimes').value=m?.times||'08:00';$('medStart').value=m?.start||dayKey();$('medEnd').value=m?.end||'';$('medActive').value=m?.active===false?'0':'1';$('medNote').value=m?.note||'';medColor=m?.color||'#1683ff';$('deleteMed').style.display=m?'block':'none';document.querySelectorAll('#medColors .colorChoice').forEach(b=>b.classList.toggle('on',b.dataset.color===medColor));$('medModal').classList.add('on')}$('openMed').onclick=()=>openMedEdit('');$('medColors').onclick=e=>{let b=e.target.closest('.colorChoice');if(!b)return;medColor=b.dataset.color;document.querySelectorAll('#medColors .colorChoice').forEach(x=>x.classList.toggle('on',x===b))};
$('saveMed').onclick=()=>{if(!$('medName').value.trim())return toast('先填药名');let id=$('editMedId').value,obj={id:id||uid('m'),name:$('medName').value.trim(),dose:$('medDose').value.trim(),frequency:$('medFreq').value,times:$('medTimes').value.trim()||'08:00',start:$('medStart').value||dayKey(),end:$('medEnd').value,interval:Number($('medInterval').value)||7,active:$('medActive').value==='1',note:$('medNote').value.trim(),color:medColor};if(id){data.meds=data.meds.map(m=>m.id===id?obj:m)}else data.meds.push(obj);$('medModal').classList.remove('on');save();toast(id?'药物已更新':'药物已添加')};$('deleteMed').onclick=()=>{let id=$('editMedId').value;if(!id)return;data.meds=data.meds.filter(m=>m.id!==id);data.logs=data.logs.filter(l=>l.medId!==id);$('medModal').classList.remove('on');save();toast('药物已删除')};
document.querySelectorAll('.seg [data-filter]').forEach(b=>b.onclick=()=>{filter=b.dataset.filter;document.querySelectorAll('.seg [data-filter]').forEach(x=>x.classList.toggle('on',x===b));renderMeds()});$('editPet').onclick=()=>{$('petName').value=data.pet.name;$('petWeight').value=data.pet.weight;$('petAge').value=data.pet.age;$('petModal').classList.add('on')};$('savePet').onclick=()=>{data.pet={name:$('petName').value||'咪咪',weight:$('petWeight').value,age:$('petAge').value};$('petModal').classList.remove('on');save()};
function dl(n,c,t){let b=new Blob([c],{type:t}),u=URL.createObjectURL(b),a=document.createElement('a');a.href=u;a.download=n;a.click();URL.revokeObjectURL(u)}$('exportData').onclick=()=>dl('cat-care-data-'+dayKey()+'.json',JSON.stringify(data,null,2),'application/json');$('exportIcs').onclick=()=>{let lines=['BEGIN:VCALENDAR','VERSION:2.0','PRODID:-//Pet Health Assistant//CN'],stamp=new Date().toISOString().replace(/[-:]/g,'').split('.')[0]+'Z';data.meds.filter(m=>m.active&&m.frequency!=='prn').forEach(m=>medTimes(m,m.start).forEach((d,i)=>{let st=new Date(d.dueAt),en=new Date(st.getTime()+9e5),f=x=>x.toISOString().replace(/[-:]/g,'').replace(/\.\d{3}/,'');let rule=m.frequency==='alt'?'FREQ=DAILY;INTERVAL=2':m.frequency==='interval'?'FREQ=DAILY;INTERVAL='+(m.interval||7):'FREQ=DAILY';lines.push('BEGIN:VEVENT','UID:'+m.id+i+'@pet-health','DTSTAMP:'+stamp,'DTSTART:'+f(st),'DTEND:'+f(en),'RRULE:'+rule,'BEGIN:VALARM','TRIGGER:-PT10M','ACTION:DISPLAY','DESCRIPTION:该吃药了：'+m.name+' '+m.dose,'END:VALARM','SUMMARY:猫咪吃药：'+m.name,'DESCRIPTION:'+m.dose,'END:VEVENT')}));lines.push('END:VCALENDAR');dl('cat-medicine-reminders.ics',lines.join('\r\n'),'text/calendar')};render();
</script>
