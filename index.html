<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#fbf8ff"><title>宠物健康小助手</title><style>:root{--ink:#25213d;--muted:#8d879d;--line:rgba(151,132,201,.16);--bg:#fbf8ff;--card:rgba(255,255,255,.82);--purple:#8d6df4;--purple2:#b8a4ff;--pink:#ff7fa3;--mint:#74d9ca;--green:#48bd7d;--red:#ff6576;--shadow:0 14px 34px rgba(99,80,150,.12);--soft:inset 0 0 0 1px rgba(255,255,255,.72),0 12px 30px rgba(95,76,142,.11)}*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}html{min-height:100%;background:var(--bg)}body{margin:0;min-height:100dvh;overflow-x:hidden;background:radial-gradient(circle at 10% -6%,#efe8ff 0 230px,transparent 410px),radial-gradient(circle at 94% 8%,#fff0f5 0 180px,transparent 330px),linear-gradient(180deg,#fff 0,#fbf8ff 48%,#f9f7ff 100%);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"PingFang SC",system-ui,sans-serif}.app{width:100%;max-width:430px;min-height:100dvh;margin:0 auto;padding:max(14px,env(safe-area-inset-top)) 16px calc(92px + env(safe-area-inset-bottom));position:relative}.page{display:none}.page.on{display:block}.top,.pet,.head,.row,.medrow,.recrow{display:flex;align-items:center}.top,.head{justify-content:space-between;gap:12px;margin:8px 0 16px}.pet{gap:12px;min-width:0}.avatar{flex:0 0 auto;width:60px;height:60px;border-radius:22px;background:linear-gradient(145deg,#fff8e8,#ffe6ef);display:grid;place-items:center;font-size:38px;box-shadow:var(--soft)}h1,h2,h3,p{margin:0}h1{font-size:24px;line-height:1.08;font-weight:950;letter-spacing:0}h2{font-size:19px;font-weight:950}.sub,.tiny{color:var(--muted)}.sub{font-size:13px;margin-top:4px}.tiny{font-size:12px}.iconbtn,.addplus{border:0;display:grid;place-items:center;flex:0 0 auto}.iconbtn{width:42px;height:42px;border-radius:16px;background:rgba(255,255,255,.78);box-shadow:var(--soft);color:var(--purple);font-size:20px}.addplus{width:36px;height:36px;border-radius:50%;background:var(--purple);color:#fff;font-size:24px}.card,.summary,.metric,.plancard{background:var(--card);border:1px solid var(--line);box-shadow:var(--soft);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px)}.card{border-radius:24px;padding:17px;margin:14px 0}.soft{background:linear-gradient(145deg,rgba(255,255,255,.9),rgba(245,240,255,.82))}.pee-card{display:grid;grid-template-columns:minmax(0,1fr) 118px;gap:12px;align-items:end}.label{font-size:15px;font-weight:950;color:#6250c8}.big{font-size:42px;line-height:1;font-weight:950;color:#171326}.ok{display:inline-flex;margin-top:5px;color:#3faf74;font-weight:850;font-size:13px}.bars{height:92px;display:flex;align-items:end;justify-content:flex-end;gap:8px;padding-bottom:18px}.bar{width:17px;border-radius:10px 10px 5px 5px;background:linear-gradient(180deg,#ddd3ff,#8d6df4);opacity:.45;position:relative}.bar b{position:absolute;bottom:-20px;left:50%;transform:translateX(-50%);font-size:10px;color:#b8b1c9}.grid2{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:12px}.medrow,.recrow{justify-content:space-between;gap:10px;padding:12px 0;border-top:1px solid rgba(151,132,201,.14);min-width:0}.medrow:first-child,.recrow:first-child{border-top:0}.time{font-size:17px;font-weight:950;white-space:nowrap}.medmain{flex:1;min-width:0}.medname{font-weight:950;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.dose{font-size:13px;color:#a87932;font-weight:850}.primary{width:100%;min-height:56px;border:0;border-radius:22px;background:linear-gradient(90deg,var(--purple2),var(--purple));color:white;font-weight:950;font-size:17px;box-shadow:0 12px 26px rgba(141,109,244,.28)}.pink{background:linear-gradient(90deg,#ff91ad,#ff6f98)}.ghost{border:0;background:#f5f1fb;color:var(--purple);border-radius:17px;min-height:42px;padding:0 14px;font-weight:950}.tabs{position:fixed;z-index:10;left:50%;bottom:0;transform:translateX(-50%);width:100%;max-width:430px;min-height:76px;padding:8px 14px max(8px,env(safe-area-inset-bottom));background:rgba(255,255,255,.9);border-top:1px solid rgba(151,132,201,.15);display:grid;grid-template-columns:repeat(4,minmax(0,1fr));backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px)}.tab{border:0;background:transparent;color:#aaa4b6;font-size:11px;font-weight:950;min-width:0}.tab span{display:block;font-size:21px;margin-bottom:2px}.tab.on{color:var(--purple)}.back{border:0;background:transparent;color:#39334e;font-size:31px;line-height:1}.dates{display:flex;gap:9px;overflow-x:auto;margin:0 -16px;padding:2px 16px 12px;scrollbar-width:none}.dates::-webkit-scrollbar{display:none}.datepill{min-width:70px;border:0;border-radius:16px;background:rgba(255,255,255,.35);color:#9992a9;padding:9px 10px;font-weight:950}.datepill.on{background:var(--purple);color:#fff}.water{flex:0 0 auto;width:34px;height:34px;border-radius:13px;background:#e0f8f4;display:grid;place-items:center;font-size:20px}.status{color:var(--green);font-weight:950}.summary{display:grid;grid-template-columns:1fr 1fr;text-align:center;border-radius:22px;padding:18px;margin:14px 0}.summary div+div{border-left:1px solid rgba(151,132,201,.18)}.seg{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:7px;background:rgba(255,255,255,.72);border:1px solid var(--line);border-radius:20px;padding:6px;margin-bottom:16px}.seg button{border:0;border-radius:15px;background:transparent;height:42px;color:#918aa1;font-weight:950}.seg button.on{background:linear-gradient(90deg,#ff85a6,#ff7198);color:white}.plan{position:relative;margin-left:18px;padding-left:10px}.plan:before{content:"";position:absolute;left:0;top:18px;bottom:18px;border-left:1px solid #e6dff0}.planrow{display:grid;grid-template-columns:62px minmax(0,1fr);gap:12px;align-items:center;margin:16px 0}.plantime{font-weight:950;color:#50b983}.plantime.late{color:var(--red)}.plancard{position:relative;border-radius:20px;padding:14px;display:flex;align-items:center;justify-content:space-between;gap:10px;min-width:0}.dot{width:16px;height:16px;border-radius:50%;background:#d8d4e2;border:4px solid white;box-shadow:0 0 0 1px #d8d4e2;position:absolute;left:-19px}.catbox{text-align:center;padding:10px 0 0}.catbig{font-size:76px;line-height:1}.bubble{display:inline-block;border:2px solid #a5e6d5;border-radius:20px;padding:12px 16px;background:#fbfffd;color:#51ad8b;font-weight:950}.chart{height:170px;overflow:hidden;margin-top:12px}.chart svg{width:100%;height:100%;overflow:visible}.metric{border-radius:20px;padding:16px;text-align:center}.metric b{font-size:28px}.ring{width:78px;height:78px;border-radius:50%;background:conic-gradient(var(--purple) 0 0deg,#eee9fb 0);display:grid;place-items:center;margin:auto;font-weight:950;font-size:21px}.modal{position:fixed;inset:0;z-index:20;background:rgba(28,22,50,.34);display:none;align-items:end;justify-content:center}.modal.on{display:flex}.sheet{width:100%;max-width:430px;max-height:88dvh;overflow:auto;background:white;border-radius:28px 28px 0 0;padding:18px 18px max(22px,env(safe-area-inset-bottom));box-shadow:0 -18px 54px rgba(47,38,72,.22)}.sheethead{display:flex;align-items:center;justify-content:space-between;margin-bottom:16px}.x{border:0;background:transparent;font-size:24px}.field{margin:14px 0}.field label{display:block;margin-bottom:7px;font-size:14px;font-weight:900;color:#3b3455}.chips{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.chip{border:0;border-radius:17px;background:#f7f4fb;min-height:64px;color:#918aa1;font-weight:950}.chip.on{background:#f0eaff;color:var(--purple);box-shadow:inset 0 0 0 2px #d9ceff}.colors{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}.colorchip{border:0;background:white;text-align:center;color:#8e879d;font-size:12px;font-weight:850}.colorchip i{display:block;width:30px;height:30px;border-radius:50%;margin:0 auto 6px}.colorchip.on i{box-shadow:0 0 0 4px #e9fff6,0 0 0 7px var(--mint)}input,textarea,select{width:100%;border:0;background:#f8f6fb;border-radius:17px;padding:14px 15px;font:inherit;color:var(--ink);min-width:0}textarea{min-height:86px;resize:vertical}.formgrid{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:10px}.empty{text-align:center;color:#aaa4b6;padding:22px}.toast{position:fixed;z-index:30;left:50%;bottom:92px;transform:translateX(-50%);background:#211b35;color:white;border-radius:999px;padding:12px 18px;font-weight:950;opacity:0;pointer-events:none;transition:.2s}.toast.on{opacity:1}@media(max-width:390px){.app{padding-left:14px;padding-right:14px}.pee-card{grid-template-columns:1fr}.bars{justify-content:flex-start}.grid2{gap:10px}.planrow{grid-template-columns:56px minmax(0,1fr)}.time{font-size:16px}.card{padding:16px}}@media(min-width:520px){.app{margin-top:18px;margin-bottom:18px;min-height:860px;border-radius:34px;box-shadow:0 0 0 1px rgba(151,132,201,.18),0 30px 80px rgba(65,51,103,.16)}.tabs{border-radius:0 0 34px 34px}}</style></head><body><main class="app"><section id="home" class="page on"><div class="top"><div class="pet"><div class="avatar">🐱</div><div><h1 id="homeName">咪咪</h1><p class="sub" id="petInfo">体重 5.2kg</p></div></div><button class="iconbtn" id="editPet">♡</button></div><div class="card soft pee-card"><div><p class="label">今日尿尿</p><p><span class="big" id="todayCount">0</span> 次</p><p class="ok" id="rangeText">今天还没有记录</p></div><div class="bars" id="miniBars"></div></div><div class="card"><div class="head"><h2>今日用药</h2><p class="tiny" id="medProgress">0/0 已完成</p></div><div id="homeMeds"></div></div><button class="primary" id="quickPee">💧 记录尿尿</button></section><section id="peePage" class="page"><div class="head"><button class="back" data-go="home">‹</button><h2>尿尿记录</h2><button class="iconbtn" id="openPee2">＋</button></div><div class="dates" id="dates"></div><div class="card"><div id="peeList"></div></div><div class="summary"><div><p class="tiny">今日共</p><b id="sumCount">0 次</b></div><div><p class="tiny">平均间隔</p><b id="avgGap">--</b></div></div><button class="primary" id="openPee3">＋ 添加记录</button></section><section id="medPage" class="page"><div class="head"><button class="back" data-go="home">‹</button><h2>用药计划</h2><button class="addplus" id="openMed">+</button></div><div class="seg"><button class="on" data-filter="all">今日</button><button data-filter="active">全部</button><button data-filter="stopped">已停用</button></div><p class="sub" id="medDate"></p><div class="plan" id="plan"></div><div class="catbox"><span class="bubble">按时吃药<br>身体棒棒！</span><div class="catbig">🐱</div></div></section><section id="statsPage" class="page"><div class="head"><button class="back" data-go="home">‹</button><h2>数据统计</h2><button class="iconbtn" id="exportData">⇩</button></div><div class="seg"><button class="on">尿尿</button><button>用药</button><button id="exportIcs">提醒</button></div><div class="card"><h3>过去7天尿尿次数</h3><div class="chart"><svg viewBox="0 0 320 150"><g id="chartGrid"></g><polyline id="chartLine" fill="none" stroke="#8c6cf1" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/><g id="chartDots"></g></svg></div></div><div class="grid2"><div class="metric"><p class="tiny">平均次数/天</p><b id="avgDay">0</b></div><div class="metric"><p class="tiny">平均间隔</p><b id="avgAllGap">--</b></div></div><div class="card grid2"><div><div class="ring" id="rateRing">0%</div><p class="tiny" style="text-align:center;margin-top:8px">本周用药完成率</p></div><div class="metric"><p class="tiny">漏服次数</p><b id="missed">0</b></div></div></section><nav class="tabs"><button class="tab on" data-go="home"><span>⌂</span>首页</button><button class="tab" data-go="peePage"><span>💧</span>尿尿</button><button class="tab" data-go="medPage"><span>💊</span>用药</button><button class="tab" data-go="statsPage"><span>▥</span>数据</button></nav></main><div class="modal" id="peeModal"><div class="sheet"><div class="sheethead"><button class="x" data-close="peeModal">×</button><h2>添加尿尿记录</h2><button class="x" id="savePee">✓</button></div><div class="field"><label>时间</label><input id="peeTime" type="datetime-local"></div><div class="field"><label>尿量</label><div class="chips" id="amountChips"><button class="chip" data-v="少">💧<br>少</button><button class="chip on" data-v="正常">💧<br>正常</button><button class="chip" data-v="多">💧<br>多</button></div></div><div class="field"><label>颜色</label><div class="colors" id="colorChips"><button class="colorchip on" data-v="浅黄"><i style="background:#ffd86b"></i>浅黄</button><button class="colorchip" data-v="深黄"><i style="background:#f6a640"></i>深黄</button><button class="colorchip" data-v="橙色"><i style="background:#ff9448"></i>橙色</button><button class="colorchip" data-v="红色"><i style="background:#ff656d"></i>红色</button></div></div><div class="field"><label>备注</label><textarea id="peeNote" placeholder="可选，记录异常情况..."></textarea></div></div></div><div class="modal" id="medModal"><div class="sheet"><div class="sheethead"><button class="x" data-close="medModal">×</button><h2>添加药物</h2><button class="x" id="saveMed">✓</button></div><div class="field"><label>药物名称</label><input id="medName" placeholder="例如 肾脏药"></div><div class="formgrid"><div class="field"><label>剂量</label><input id="medDose" placeholder="1粒"></div><div class="field"><label>频率</label><select id="medFreq"><option value="daily">每天</option><option value="bid">每天两次</option><option value="hours">每12小时</option><option value="alt">隔天</option></select></div></div><div class="field"><label>时间</label><input id="medTimes" placeholder="08:00, 20:00"></div><div class="formgrid"><div class="field"><label>开始日期</label><input id="medStart" type="date"></div><div class="field"><label>状态</label><select id="medActive"><option value="1">使用中</option><option value="0">已停用</option></select></div></div><button class="primary pink" id="saveMed2">保存</button></div></div><div class="modal" id="petModal"><div class="sheet"><div class="sheethead"><button class="x" data-close="petModal">×</button><h2>猫咪资料</h2><button class="x" id="savePet">✓</button></div><div class="field"><label>名字</label><input id="petName"></div><div class="formgrid"><div class="field"><label>体重</label><input id="petWeight" placeholder="5.2kg"></div><div class="field"><label>年龄</label><input id="petAge" placeholder="8岁"></div></div></div></div><div class="toast" id="toast">已保存</div><script>const K='cat-health-assistant-v1',oldK='cat-care-local-v3';let sel=dayKey(),filter='all',tmp={amount:'正常',color:'浅黄'};const $=id=>document.getElementById(id),fmtD=new Intl.DateTimeFormat('zh-CN',{month:'long',day:'numeric',weekday:'short'}),fmtT=new Intl.DateTimeFormat('zh-CN',{hour:'2-digit',minute:'2-digit'});function dayKey(d=new Date){return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')}function dtLocal(d=new Date){return dayKey(d)+'T'+String(d.getHours()).padStart(2,'0')+':'+String(d.getMinutes()).padStart(2,'0')}function uid(p){return p+Date.now()+Math.random().toString(16).slice(2)}function load(){try{let v=localStorage.getItem(K);if(v)return JSON.parse(v);let old=localStorage.getItem(oldK);if(old){let o=JSON.parse(old);return{pet:{name:o.cat||'咪咪',weight:'5.2kg',age:'8岁'},pees:(o.pees||[]).map(p=>({id:p.id,at:p.at,amount:'正常',color:p.color||'浅黄',note:p.note||''})),meds:(o.meds||[]).map(m=>({id:m.id,name:m.name,dose:m.dose,frequency:m.mode||'daily',times:m.times||'09:00',start:m.start||dayKey(),active:m.active!==false,note:m.note||''})),logs:(o.logs||[]).map(l=>({id:l.id,medId:l.mid,dueAt:l.due,status:l.status,at:l.at}))}}}catch{}return{pet:{name:'咪咪',weight:'5.2kg',age:'8岁'},pees:[],meds:[{id:uid('m'),name:'肾脏药',dose:'1粒',frequency:'daily',times:'08:00',start:dayKey(),active:true,note:''},{id:uid('m'),name:'消炎药',dose:'0.5粒',frequency:'daily',times:'20:00',start:dayKey(),active:true,note:''},{id:uid('m'),name:'营养剂',dose:'1粒',frequency:'daily',times:'22:00',start:dayKey(),active:true,note:''}],logs:[]}}let data=load();function save(){localStorage.setItem(K,JSON.stringify(data));render()}function esc(s){return String(s||'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}function toast(t='已保存'){let el=$('toast');el.textContent=t;el.classList.add('on');setTimeout(()=>el.classList.remove('on'),1300)}function peesFor(d){return data.pees.filter(p=>p.at.slice(0,10)===d).sort((a,b)=>a.at.localeCompare(b.at))}function lastNDays(n){return Array.from({length:n},(_,i)=>{let d=new Date;d.setDate(d.getDate()-n+1+i);return dayKey(d)})}function medTimes(m,d){if(!m.active&&filter!=='stopped')return[];if(d<m.start)return[];let diff=Math.round((new Date(d)-new Date(m.start))/864e5);if(m.frequency==='alt'&&diff%2!==0)return[];let ts=(m.times||'09:00').split(',').map(x=>x.trim()).filter(Boolean);if(m.frequency==='bid'&&ts.length<2)ts=['08:00','20:00'];if(m.frequency==='hours')ts=['08:00','20:00'];return ts.map(t=>({med:m,time:t,dueAt:d+'T'+t+':00'}))}function dosesFor(d=dayKey()){return data.meds.flatMap(m=>medTimes(m,d)).sort((a,b)=>a.dueAt.localeCompare(b.dueAt))}function logFor(d){return data.logs.find(l=>l.medId===d.med.id&&l.dueAt===d.dueAt)}function go(page){document.querySelectorAll('.page').forEach(p=>p.classList.toggle('on',p.id===page));document.querySelectorAll('.tab').forEach(t=>t.classList.toggle('on',t.dataset.go===page))}document.body.addEventListener('click',e=>{let g=e.target.closest('[data-go]');if(g)go(g.dataset.go);let c=e.target.closest('[data-close]');if(c)$(c.dataset.close).classList.remove('on');let d=e.target.closest('[data-dose]');if(d){let[mid,due,status]=d.dataset.dose.split('|');data.logs=data.logs.filter(l=>!(l.medId===mid&&l.dueAt===due));data.logs.push({id:uid('l'),medId:mid,dueAt:due,status,at:new Date().toISOString()});save();toast(status==='taken'?'已记录吃药':'已跳过')}});function openModal(id){$(id).classList.add('on')}function render(){let pet=data.pet;$('homeName').textContent=pet.name;$('petInfo').textContent='体重 '+(pet.weight||'--')+(pet.age?' · '+pet.age:'');let ps=peesFor(dayKey());$('todayCount').textContent=ps.length;$('rangeText').textContent=ps.length>=2&&ps.length<=6?'正常范围 ✓':ps.length?'请留意变化':'今天还没有记录';$('miniBars').innerHTML=lastNDays(5).map(d=>`<div class="bar" style="height:${18+Math.min(6,peesFor(d).length)*10}px;opacity:${d===dayKey()?1:.45}"><b>${Number(d.slice(8))}</b></div>`).join('');let ds=dosesFor(),done=ds.filter(x=>logFor(x)?.status==='taken').length;$('medProgress').textContent=`${done}/${ds.length} 已完成`;$('homeMeds').innerHTML=ds.length?ds.map(doseRow).join(''):'<p class="empty">今天没有用药计划</p>';renderDates();renderPees();renderMeds();renderStats()}function doseRow(d){let l=logFor(d),mark=l?.status==='taken'?'✓':l?.status==='skipped'?'↷':'○';return`<div class="medrow"><span class="time">${d.time}</span><div class="medmain"><div class="medname">${esc(d.med.name)}</div><p class="dose">${esc(d.med.dose)}</p></div><button class="ghost" data-dose="${d.med.id}|${d.dueAt}|taken">${mark}</button></div>`}function renderDates(){let ds=lastNDays(5);$('dates').innerHTML=ds.map(d=>`<button class="datepill ${d===sel?'on':''}" data-date="${d}">${Number(d.slice(5,7))}月${Number(d.slice(8))}日</button>`).join('');document.querySelectorAll('[data-date]').forEach(b=>b.onclick=()=>{sel=b.dataset.date;render()})}function gapText(ps){if(ps.length<2)return'--';let mins=[];for(let i=1;i<ps.length;i++)mins.push((new Date(ps[i].at)-new Date(ps[i-1].at))/6e4);let m=mins.reduce((a,b)=>a+b,0)/mins.length,h=Math.floor(m/60),mi=Math.round(m%60);return h?`${h}小时${mi}分钟`:`${mi}分钟`}function renderPees(){let ps=peesFor(sel);$('peeList').innerHTML=ps.length?ps.map(p=>`<div class="recrow"><span class="water">💧</span><b class="time">${fmtT.format(new Date(p.at))}</b><span class="status">${esc(p.amount)}</span><span class="tiny">${esc(p.color)}</span></div>`).join(''):'<p class="empty">这天还没有记录</p>';$('sumCount').textContent=ps.length+' 次';$('avgGap').textContent=gapText(ps)}function renderMeds(){let d=dayKey();$('medDate').textContent=fmtD.format(new Date(d+'T12:00:00'));let list=(filter==='active'?data.meds.filter(m=>m.active):filter==
